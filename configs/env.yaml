# Environment: the working-context ceiling, the step budget and the reward.
#
# All token counts are in the tokenizer named here. "whitespace" is the
# deterministic word/punctuation counter in longctx/tokens.py (no model
# needed, exact, used by the tests). "hf:<repo>" counts with that model's
# tokenizer so the ceiling matches what the policy actually sees.
tokenizer: whitespace

# The HARD ceiling on the working context (held chunks + summaries). Any action
# that would push usage above this ends the episode with reward.r_fail.
# 600 with chunks in [320, 480] tokens means two full chunks never fit: the
# policy must COMPRESS (or DROP and lose the bridge entity) between reads.
context_ceiling: 600

# Step budget = base + per_hop * n_hops. Exhausting it is a failure.
step_budget_base: 6
step_budget_per_hop: 4

# What the generator assumes a good summary costs when it computes the
# per-instance minimum step count (a COMPRESS is only required when the next
# chunk would not fit next to what is held).
assumed_summary_tokens: 32

# Maximum length of a COMPRESS summary. Longer summaries are truncated at this
# many tokens BEFORE accounting, so a policy cannot "compress" a chunk into a
# copy of itself.
max_summary_tokens: 120

reward:
  # R = 1 - beta * (steps_used / min_steps) when correct. beta is small on
  # purpose: correctness dominates, efficiency is a tiebreaker.
  beta: 0.05
  # Floor on the correct-answer reward so a long-but-correct episode never
  # scores below a wrong answer.
  r_correct_min: 0.5
  # Ceiling exceeded or step budget exhausted.
  r_fail: -0.5
  # Wrong answer.
  r_wrong: 0.0
  # Optional abstention: ANSWER unknown scores r_abstain (> r_wrong) when enabled.
  allow_abstain: false
  r_abstain: 0.1
  abstain_token: unknown
